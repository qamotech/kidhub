<style id="refine-css">
/* UI/style refinements layered on the base studio styles (loads after zz-polish). */
:root{--kh-tap:44px}
/* Touch targets: every round icon button and phone pill reaches the 44px minimum */
.round{width:var(--kh-tap);height:var(--kh-tap);min-width:var(--kh-tap)}
@media (max-width:620px){.pill{height:var(--kh-tap)}}
/* Friendlier empty states: a soft dashed card instead of tiny grey text */
div.empty{font-size:.9rem;line-height:1.45;padding:16px 14px;border:2px dashed color-mix(in srgb,var(--muted) 30%,transparent);border-radius:16px;background:color-mix(in srgb,var(--card) 60%,transparent)}
div.empty::before{content:"✨";display:block;font-size:1.4rem;margin-bottom:4px}
/* Typography: balanced headings and no lonely last words in paragraphs */
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
/* Calm motion: the device's "reduce motion" setting gets the same safety net as the in-app Reduce motion switch */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
body.reduce *,body.reduce *::before,body.reduce *::after{animation-iteration-count:1!important;scroll-behavior:auto!important}
/* More contrast: the device's "increase contrast" setting mirrors the in-app High contrast switch */
@media (prefers-contrast:more){body{--line:#667085}body .card,body .panel,body .side{border-width:2px}}
/* Windows High Contrast / forced colors: keep cards, pills and buttons outlined, focus uses the system Highlight, decorations step aside */
@media (forced-colors:active){
.card,.panel,.side,.pill,.round,button,div.empty{border:1px solid CanvasText}
:focus-visible{outline:3px solid Highlight!important;outline-offset:3px}
.sz-layer,.sz-trail,.sz-pop,.sz-sky{display:none}
body::after{display:none}
}
/* Press feedback: buttons sink a little while held (uses `scale`, so hover lifts keep working); off with reduced motion */
@media (prefers-reduced-motion:no-preference){body:not(.reduce) :is(button,.btn,.tool,.pill,.round,.chip):active:not(:disabled){scale:.96}}
/* Theme-matched form controls: checkboxes, sliders, radios and the text cursor follow the theme (seasons recolor --pink) */
:where(input,progress,meter){accent-color:var(--pink)}
:where(input,textarea,[contenteditable]){caret-color:var(--pink)}
/* Steady numbers: scores, timers, counters and stats use equal-width digits so they don't jiggle as they change */
#count,#score,#timer,.stat,.stat-value,.stats,.badge,.kh-num{font-variant-numeric:tabular-nums}
/* Clear unavailable and busy states */
html :is(button,input,select,textarea,.btn):disabled,[aria-disabled="true"]{cursor:not-allowed}
[aria-busy="true"]{cursor:progress}
/* Themed text highlight and scrollbars (seasons keep their own via html[data-season]) */
::selection{background:color-mix(in srgb,var(--pink) 80%,#000);color:#fff}
html{scrollbar-color:color-mix(in srgb,var(--pink) 55%,transparent) transparent}
/* Jump links and deep links land with breathing room instead of flush against the top edge */
:is(section,.panel,.card,h1,h2,h3)[id]{scroll-margin-top:16px}
/* Snappy taps: no double-tap-zoom delay on controls, and the press-sink replaces the grey tap flash */
:where(button,a,.btn,.tool,.pill,.round,.chip,.card,label,summary,select){touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* Phone fit: phones keep the chosen text size, and long words or links wrap inside cards instead of pushing the page sideways */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:where(.card,.panel,div.empty,#toasts>*) :where(h1,h2,h3,h4,p,li,small,a){overflow-wrap:anywhere}
/* Jump targets: the card or heading a link lands on glows once in the theme color (screens are excluded; off with reduced motion) */
@keyframes kh-target{from{box-shadow:0 0 0 4px color-mix(in srgb,var(--pink) 60%,transparent)}to{box-shadow:0 0 0 4px transparent}}
:is(.panel,.card,h2,h3)[id]:target{animation:kh-target 1.6s ease-out;border-radius:12px}
body.reduce :target{animation:none}
/* Readable hints: placeholder text uses the theme's muted ink (seasons and dark themes recolor --muted) instead of faint browser grey */
::placeholder{color:var(--muted);opacity:.8}
/* Disclosures: every "details" summary is a full 44px tap target with a pointer, so collapsible sections read as tappable */
:where(summary){cursor:pointer;min-height:var(--kh-tap);padding-block:10px;box-sizing:border-box}
/* Print-friendly: floating buttons, panels, toasts and sky effects stay off paper, and cards don't split across pages */
@media print{
.cw-btn,.cw-panel,.kh-top,.kh-update,#toasts,.toasts,.sz-layer,.sz-trail,.sz-pop,.sz-sky{display:none!important}
body::after{display:none!important}
html[data-theme] body,body{background:#fff!important;color:#000;transition:none!important}
.card,.panel,div.empty{break-inside:avoid;box-shadow:none}
}
/* Contained scrolling: reaching the end of a panel, toolbar or wide grid no longer drags the whole page along */
:where(.controls,.cw-body,.pp-tools,.pp-stage,.md-grid,.md-kb){overscroll-behavior:contain}
/* Readable links: text links get an underline that clears descenders and thickens on hover (buttons and pills are untouched) */
:where(p,li,small,td,.card,.panel,div.empty) a:not(.btn,.pill,.chip,.round,.tool,[class*="btn"]){text-underline-offset:.2em;text-decoration-thickness:max(1px,.07em)}
:where(p,li,small,td,.card,.panel,div.empty) a:not(.btn,.pill,.chip,.round,.tool,[class*="btn"]):hover{text-decoration-thickness:max(2px,.12em)}
/* Steady layout: the page keeps room for its scrollbar, so opening a panel that locks scrolling doesn't nudge everything sideways */
html{scrollbar-gutter:stable}
/* Less see-through: the device's "reduce transparency" setting swaps frosted-glass blur for solid surfaces */
@media (prefers-reduced-transparency:reduce){*,*::before,*::after{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}.glass-panel,.top{background:var(--card,#fff)!important}}
/* Themed list markers: bullets and numbers take the theme color (seasons recolor --pink), so lists match their headings */
:where(ul,ol) > li::marker{color:var(--pink)}
/* Touch screens: tapping a music or paint button no longer leaves it stuck raised in its hover pose */
@media (hover:none){:is(.md,.pp) button:hover{transform:none}.pp button:not(.on):hover{box-shadow:none}}
/* Keycaps: keyboard hints like Esc and A–K look like real keys in the theme's colors */
kbd{display:inline-block;min-width:1.6em;padding:.05em .45em;border:1px solid var(--line,#ccc);border-bottom-width:3px;border-radius:6px;background:var(--soft,#f6f6f6);color:var(--ink,inherit);font:700 .85em/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:center;white-space:nowrap;vertical-align:.08em}
/* Touch sliders: on touch screens every slider (brush size, volume, tempo...) gets a 44px tall hit area */
@media (pointer:coarse){input[type=range]{min-height:44px}}
/* Smooth sections: collapsible sections slide open and closed where supported (instant with reduced motion or the in-app switch) */
@media (prefers-reduced-motion:no-preference){:root{interpolate-size:allow-keywords}body:not(.reduce) details::details-content{block-size:0;overflow:clip;transition:block-size .22s cubic-bezier(.2,.7,.3,1),content-visibility .22s allow-discrete}body:not(.reduce) details[open]::details-content{block-size:auto}}
/* Toasts: they fit on phones (never wider than the screen) and sit above the home-indicator bar on notched phones */
.toasts{right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));max-width:min(360px,calc(100vw - 32px))}
/* Toasts: a theme-colored edge ties each message to the current theme (seasons recolor --pink) */
.toast{border-inline-start:4px solid var(--pink);line-height:1.4;overflow-wrap:anywhere}
/* Toasts: each message slides up and fades in instead of popping (off with reduced motion or the in-app switch) */
@keyframes kh-toast-in{from{opacity:0;translate:0 10px}}
@media (prefers-reduced-motion:no-preference){body:not(.reduce) .toast{animation:kh-toast-in .22s cubic-bezier(.2,.7,.3,1)}}
/* Narrow phones: long words in card text break with a hyphen instead of leaving ragged gaps */
@media (max-width:420px){:where(.card,.panel,div.empty) :where(p,li,small){hyphens:auto;-webkit-hyphens:auto}}
</style>
