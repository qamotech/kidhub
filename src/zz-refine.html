<style id="refine-css">
/* UI/style refinements layered on the base studio styles (loads after zz-polish). */
:root{--kh-tap:44px}
/* Touch targets: every round icon button and phone pill reaches the 44px minimum */
.round{width:var(--kh-tap);height:var(--kh-tap);min-width:var(--kh-tap)}
@media (max-width:620px){.pill{height:var(--kh-tap)}}
/* Friendlier empty states: a soft dashed card instead of tiny grey text */
div.empty{font-size:.9rem;line-height:1.45;padding:16px 14px;border:2px dashed color-mix(in srgb,var(--muted) 30%,transparent);border-radius:16px;background:color-mix(in srgb,var(--card) 60%,transparent)}
div.empty::before{content:"✨";display:block;font-size:1.4rem;margin-bottom:4px}
/* Typography: balanced headings and no lonely last words in paragraphs */
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
/* Calm motion: the device's "reduce motion" setting gets the same safety net as the in-app Reduce motion switch */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
body.reduce *,body.reduce *::before,body.reduce *::after{animation-iteration-count:1!important;scroll-behavior:auto!important}
/* More contrast: the device's "increase contrast" setting mirrors the in-app High contrast switch */
@media (prefers-contrast:more){body{--line:#667085}body .card,body .panel,body .side{border-width:2px}}
/* Windows High Contrast / forced colors: keep cards, pills and buttons outlined, focus uses the system Highlight, decorations step aside */
@media (forced-colors:active){
.card,.panel,.side,.pill,.round,button,div.empty{border:1px solid CanvasText}
:focus-visible{outline:3px solid Highlight!important;outline-offset:3px}
.sz-layer,.sz-trail,.sz-pop,.sz-sky{display:none}
body::after{display:none}
}
/* Press feedback: buttons sink a little while held (uses `scale`, so hover lifts keep working); off with reduced motion */
@media (prefers-reduced-motion:no-preference){body:not(.reduce) :is(button,.btn,.tool,.pill,.round,.chip):active:not(:disabled){scale:.96}}
/* Theme-matched form controls: checkboxes, sliders, radios and the text cursor follow the theme (seasons recolor --pink) */
:where(input,progress,meter){accent-color:var(--pink)}
:where(input,textarea,[contenteditable]){caret-color:var(--pink)}
/* Steady numbers: scores, timers, counters and stats use equal-width digits so they don't jiggle as they change */
#count,#score,#timer,.stat,.stat-value,.stats,.badge,.kh-num{font-variant-numeric:tabular-nums}
/* Clear unavailable and busy states */
html :is(button,input,select,textarea,.btn):disabled,[aria-disabled="true"]{cursor:not-allowed}
[aria-busy="true"]{cursor:progress}
/* Themed text highlight and scrollbars (seasons keep their own via html[data-season]) */
::selection{background:color-mix(in srgb,var(--pink) 80%,#000);color:#fff}
html{scrollbar-color:color-mix(in srgb,var(--pink) 55%,transparent) transparent}
/* Jump links and deep links land with breathing room instead of flush against the top edge */
:is(section,.panel,.card,h1,h2,h3)[id]{scroll-margin-top:16px}
/* Snappy taps: no double-tap-zoom delay on controls, and the press-sink replaces the grey tap flash */
:where(button,a,.btn,.tool,.pill,.round,.chip,.card,label,summary,select){touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* Phone fit: phones keep the chosen text size, and long words or links wrap inside cards instead of pushing the page sideways */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:where(.card,.panel,div.empty,#toasts>*) :where(h1,h2,h3,h4,p,li,small,a){overflow-wrap:anywhere}
/* Jump targets: the card or heading a link lands on glows once in the theme color (screens are excluded; off with reduced motion) */
@keyframes kh-target{from{box-shadow:0 0 0 4px color-mix(in srgb,var(--pink) 60%,transparent)}to{box-shadow:0 0 0 4px transparent}}
:is(.panel,.card,h2,h3)[id]:target{animation:kh-target 1.6s ease-out;border-radius:12px}
body.reduce :target{animation:none}
</style>
