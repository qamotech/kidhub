<style id="seasons-css">
/* Seasonal Swap: 40 decoration slots, refilled by each season (Halloween → Thanksgiving → Christmas → …) */
html[data-season]{--pink:var(--s1)}
html[data-season] ::selection{background:var(--s1);color:#fff}
html[data-season]{scrollbar-color:var(--s1) transparent}
html[data-season] :focus-visible{outline:3px solid var(--s1);outline-offset:2px}
html[data-season] .btn:hover,html[data-season] .tool:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--s1) 35%,transparent),0 8px 22px color-mix(in srgb,var(--s1) 30%,transparent)}
html[data-season] .act-head h2{background-image:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s1))}
html[data-season] .card:hover .card-icon{filter:drop-shadow(0 0 10px var(--s1))}
html[data-season] .card .card-icon{position:relative}
html[data-season] .card:hover .card-icon::after{content:var(--sbadge);position:absolute;right:-14px;top:-10px;font-size:20px;line-height:1;filter:none}
html[data-season] #canvas{box-shadow:0 0 0 4px var(--s1),0 0 0 8px color-mix(in srgb,var(--s2) 70%,transparent)}
.sz-garland{position:relative;display:block;overflow:hidden;min-height:44px;white-space:nowrap;font-size:18px;line-height:1.4;letter-spacing:6px;text-align:center;margin:-4px 0 6px;pointer-events:none;user-select:none}
.sz-banner{position:relative;display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center;margin:0 0 16px;padding:16px 18px;border-radius:24px;color:#fff;background:linear-gradient(120deg,var(--s3),color-mix(in srgb,var(--s3) 70%,var(--s1)));box-shadow:0 12px 30px color-mix(in srgb,var(--s3) 35%,transparent);overflow:hidden;isolation:isolate}
.sz-banner::before{content:var(--sground);position:absolute;left:0;right:0;bottom:-6px;font-size:22px;letter-spacing:10px;white-space:nowrap;opacity:.35;z-index:-1;pointer-events:none}
.sz-mascot{font-size:44px;line-height:1;width:64px;height:64px;border-radius:20px;border:0;cursor:pointer;background:rgba(255,255,255,.16);animation:szBob 2.4s ease-in-out infinite}
.sz-mascot:active{transform:scale(.92)}
.sz-body h3{margin:0;font-size:clamp(18px,2.6vw,24px);color:#fff}
.sz-body p{margin:4px 0 0;color:#fff;font-weight:700;opacity:.95}
.sz-row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sz-chip{font:inherit;font-weight:800;font-size:14px;border:0;border-radius:999px;padding:8px 14px;min-height:40px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
.sz-chip:hover{background:rgba(255,255,255,.3)}
span.sz-chip{cursor:default}
.sz-tip{grid-column:1/-1;margin:0;font-size:14px;font-weight:700;background:rgba(0,0,0,.18);border-radius:14px;padding:8px 12px}
.sz-joke{grid-column:1/-1;margin:0;font-weight:700}
.sz-joke b{display:block}
.sz-hunt{position:absolute;top:0;z-index:5;pointer-events:auto;font-size:26px;line-height:1;border:0;background:none;cursor:pointer;padding:6px;min-width:44px;min-height:44px;animation:szPeek 2s ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.sz-layer{position:fixed;inset:0;pointer-events:none;z-index:2147482000;overflow:hidden}
.sz-fall{position:absolute;top:-8vh;font-size:var(--fs,22px);opacity:.55;animation:szFall var(--d,14s) linear var(--dl,0s) infinite}
.sz-corner{position:fixed;top:4px;font-size:34px;pointer-events:none;z-index:2147482001;opacity:.8;user-select:none}
.sz-corner.l{left:6px}.sz-corner.r{right:6px;transform:scaleX(-1)}
.sz-sky{position:fixed;right:5vw;top:90px;font-size:64px;pointer-events:none;z-index:1;opacity:.28;filter:drop-shadow(0 0 30px var(--s2));animation:szGlow 6s ease-in-out infinite}
.sz-pop{position:fixed;pointer-events:none;z-index:2147482002;font-size:18px;line-height:1;animation:szPop .8s ease-out forwards}
.sz-trail{position:fixed;pointer-events:none;z-index:2147482002;font-size:14px;animation:szTrail .7s ease-out forwards}
.sz-foot{text-align:center;font-weight:800;margin:18px 0 6px;color:var(--muted)}
.sz-set{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sz-set button{font:inherit;font-weight:700;font-size:13px;border:1px solid var(--line,#ddd);border-radius:999px;padding:6px 10px;min-height:36px;background:var(--soft,#fff);color:var(--ink,#222);cursor:pointer}
.sz-set button[aria-pressed="true"]{background:var(--s1);color:#fff;border-color:transparent}
@keyframes szBob{50%{transform:translateY(-5px) rotate(-4deg)}}
@keyframes szPeek{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(6deg)}}
@keyframes szFall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--sw,30px),55vh) rotate(180deg)}100%{transform:translate(0,115vh) rotate(360deg)}}
@keyframes szGlow{50%{opacity:.42;transform:scale(1.06)}}
@keyframes szPop{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--px),var(--py)) scale(1.1);opacity:0}}
@keyframes szTrail{to{transform:translateY(16px) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.sz-layer,.sz-trail,.sz-pop{display:none}.sz-mascot,.sz-hunt,.sz-sky{animation:none}}
body.reduce .sz-layer,body.reduce .sz-trail,body.reduce .sz-pop{display:none}
body.reduce :is(.sz-mascot,.sz-hunt,.sz-sky){animation:none}
@media (max-width:600px){.sz-sky,.sz-corner{display:none}.sz-mascot{width:52px;height:52px;font-size:36px}}
</style>

 const box=sec.querySelector(".sz-set"),pick=store.off?"off":store.pick||"auto";box.replaceChildren(...[["auto","🗓️ Auto"],...S.map(s=>[s.id,s.logo+" "+s.name]),["off","🚫 Off"]].map(([id,label])=>{const b=mk("button",null,label);b.type="button";b.dataset.season=id;b.setAttribute("aria-pressed",String(pick===id));b.onclick=()=>window.kidSeason.set(id);return b}))}
window.kidSeason={seasons:S,edits:EDITS,current:null,forDate,daysUntil,
 set(id){store.off=id==="off";store.pick=id==="off"||id==="auto"?"":id;save();decorate(S.find(s=>s.id===store.pick)||forDate());try{ui.toast(store.off?"Seasonal decorations off":"🗓️ "+(cur?cur.name:"")+" decorations on")}catch(e){}},
 apply(id){decorate(S.find(s=>s.id===id)||forDate())}};
wrapArt();wrapParty();decorate(S.find(s=>s.id===store.pick)||forDate());
/* 40 reduced-motion safety: re-evaluated live via CSS media query + body.reduce; refresh at midnight so the season swaps itself */
const msToMidnight=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n+1000};
const tick=()=>{if(!store.pick&&!store.off&&cur&&forDate().id!==cur.id)decorate(forDate());setTimeout(tick,msToMidnight())};setTimeout(tick,msToMidnight());
})();
