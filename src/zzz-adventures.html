<style id="adventure-css">
.adv{margin:18px 0;padding:18px;border:2px solid var(--purple,#8a6ee7);border-radius:20px;background:var(--card,#fff);color:var(--ink,#25304a);text-align:left;min-width:0}
.adv summary{font-weight:900;cursor:pointer}.adv .adv-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.adv button,.adv select,.adv input,.adv textarea{font:inherit;min-height:44px;border:1px solid var(--line,#ccc);border-radius:10px;padding:8px;max-width:100%;background:var(--soft,#f4f0ff);color:inherit}.adv button{cursor:pointer;font-weight:800}.adv textarea{display:block;width:100%;box-sizing:border-box}.adv progress{width:100%;accent-color:#7756bb}.adv li{margin:8px 0}.adv .adv-status{min-height:1.7em}.adv .adv-actions button[aria-pressed=true]{outline:3px solid var(--purple,#8a6ee7)}.adv h3{margin:12px 0}.adv small{display:block}.adv canvas{width:100%;max-width:440px;height:auto}.adv .adv-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.adv input[type=checkbox]{min-height:20px;width:20px}.adv .adv-card{padding:12px;border-radius:12px;background:var(--soft,#f6f2ff)}
@media print{.adv button,.adv select,.adv textarea{display:none}.adv{break-inside:avoid}}
</style>
<script id="adventure-js">
(()=>{'use strict';if(typeof app==='undefined')return;
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pick=a=>a[Math.floor(Math.random()*a.length)];
const C={
draw:['🎨 Art Studio','Make a picture with just three colors.|Create a mirrored creature with a background.|Illustrate a place using text, shapes, and your own signature.','Try a large shape first, then add smaller details.'],
game:['⭐ Catch the Stars','Play one round and notice which targets help.|Try a second round with a calmer tapping rhythm.|Compare two difficulty settings and explain which you prefer.','Look ahead instead of chasing a target that has already gone.'],
stories:['📚 Story Garden','Read a story and name the main character.|Retell its beginning, middle, and ending.|Invent a different ending that still solves the problem.','Look for what the character wants and what gets in the way.'],
music:['🎹 Music Lab','Play a four-note melody slowly.|Record a melody with a repeated phrase.|Perform the melody at two tempos and describe the difference.','Leave a rest between phrases; silence is part of music.'],
math:['🚀 Math Mission','Solve five problems and explain one answer.|Change the operation and use a hint when needed.|Write your own word problem with the same answer.','Draw groups or objects when a number feels abstract.'],
memory:['🧠 Memory Match','Finish a board while naming each picture.|Try remembering the row and column of each pair.|Replay and compare your moves with your previous round.','Turn over cards in a consistent order.'],
coding:['🤖 Code Logic','Plan a path before pressing Run.|Solve a path, then remove unnecessary moves.|Explain how a wrong instruction changes the robot’s route.','Trace each instruction with your finger before running.'],
space:['🪐 Space Explorer','Read three planet cards.|Complete the planet-order challenge.|Compare two planets using the facts on their cards.','Start with the four inner planets, then the four outer planets.'],
dino:['🦴 Dino Dig','Uncover all five finds at one dig site.|Record where you found each item.|Invent a museum label describing one find and a question about it.','A careful record matters as much as finding something.'],
puzzle:['🧩 Shapes Puzzle','Move one numbered tile into place.|Finish the first row before working on the next.|Compare a short shuffle with a longer one.','The blank space is the tool that lets other tiles move.'],
farm:['🐮 Farm Friends','Match five animals to their calls.|Say each animal’s name aloud as you answer.|Write a short farm story using three animals.','An animal can make more than one sound; these are common storybook calls.'],
color:['🖍️ Coloring Book','Color the scene using warm colors.|Use a contrasting color for a focal point.|Describe the mood of your palette and save a picture.','Repeat a color in several places to connect the picture.'],
spelling:['🔤 Word Spelling','Spell five words with hints if needed.|Choose a longer word and say its sounds.|Use three words in an original sentence.','Say the word slowly, then check one letter at a time.'],
clock:['🕒 Telling Time','Read three times to the nearest hour.|Practice half-hour and quarter-hour times.|Describe your morning as a three-event timeline.','Read the short hour hand before the long minute hand.'],
'music-maker':['🎵 Music Maker','Build a pattern with four notes.|Add repeated notes and at least one rest.|Change the speed and describe how the mood changes.','A simple motif is easier to recognize than constant random notes.'],
storybook:['📖 Storybook Creator','Write a page introducing a character and a wish.|Add a problem and a helper on the next pages.|Finish the story, read it aloud, and revise one sentence.','Let the ending connect to the wish on the first page.'],
tools:['🧰 Toolbox','Try a tool you have never used.|Change an input and predict the result.|Use a second tool to check or extend your first result.','Experiment with one change at a time.'],
arcade:['🕹️ Arcade','Read the controls before starting a game.|Choose one skill to practice for two rounds.|Record what improved and choose a different game.','Practice goals are personal; taking a break is always allowed.']
};
const KEY='kidHubAdventuresV1';let data={records:{},difficulty:'explore'};
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&j.records&&typeof j.records==='object'&&!Array.isArray(j.records)){data.records=j.records;data.difficulty=['explore','stretch','invent'].includes(j.difficulty)?j.difficulty:'explore'}}catch(e){}
function record(id){const r=data.records[id];if(!r||typeof r!=='object'||!Array.isArray(r.done))data.records[id]={done:[false,false,false],note:'',rounds:0};const t=data.records[id];t.done=t.done.slice(0,3).map(Boolean);t.note=typeof t.note==='string'?t.note.slice(0,1200):'';t.rounds=Number.isSafeInteger(t.rounds)&&t.rounds>=0?t.rounds:0;return t}
function save(status){try{localStorage.setItem(KEY,JSON.stringify(data));if(status)status.textContent='Saved on this device.'}catch(e){if(status)status.textContent='Storage is unavailable. Download your journal to keep a copy.'}}
function download(name,value){const u=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function make(id,parent,custom){if($('.adv[data-adventure="'+id+'"]',parent))return;const cfg=custom||C[id];if(!cfg)return;const r=record(id),d=document.createElement('details');d.className='adv';d.dataset.adventure=id;const missions=cfg[1].split('|');
d.innerHTML=`<summary>🧭 ${esc(cfg[0])} · Adventure trail</summary><p>Pick a challenge, try it in the activity above, then mark your own progress.</p><div class="adv-row"><label>Challenge style <select data-level><option value="explore">Explore · use hints</option><option value="stretch">Stretch · explain why</option><option value="invent">Invent · make your own</option></select></label><button type="button" data-roll>🎲 Pick a mission</button></div><p data-style></p><ol>${missions.map((m,i)=>`<li><label><input type="checkbox" data-done="${i}" ${r.done[i]?'checked':''}> ${esc(m)}</label></li>`).join('')}</ol><progress max="3" value="${r.done.filter(Boolean).length}" aria-label="Self-reported missions completed"></progress><p data-count></p><button type="button" data-tip>💡 Coach tip</button><p data-tiptext hidden>${esc(cfg[2])}</p><div data-extra></div><label>📝 My discoveries <textarea rows="3" maxlength="1200" placeholder="What did you try? What will you change next time?">${esc(r.note)}</textarea></label><div class="adv-row"><button type="button" data-export>↓ Download my journal</button><button type="button" data-reset>↩ Uncheck this trail</button></div><p class="adv-status" role="status"></p><small>Trail checkmarks are self-reported. They do not change game scores.</small>`;
parent.append(d);const status=$('.adv-status',d),count=$('[data-count]',d);function update(){const n=r.done.filter(Boolean).length;$('progress',d).value=n;count.textContent=`${n}/3 missions explored · ${n===3?'Trail complete!':'Keep discovering at your own pace.'}`;}
const level=$('[data-level]',d);level.value=data.difficulty;level.onchange=()=>{data.difficulty=level.value;$('[data-style]',d).textContent={explore:'Try it with hints or a helper. There is no time limit.',stretch:'Try it independently, then explain one decision.',invent:'Change a rule or create an original example after trying it.'}[level.value];save()};level.onchange();
d.querySelectorAll('[data-done]').forEach(c=>c.onchange=()=>{r.done[+c.dataset.done]=c.checked;update();save(status)});$('[data-roll]',d).onclick=()=>{const remaining=missions.filter((_,i)=>!r.done[i]);status.textContent='Your mission: '+pick(remaining.length?remaining:missions)};
$('[data-tip]',d).onclick=()=>{$('[data-tiptext]',d).hidden=!$('[data-tiptext]',d).hidden};$('textarea',d).oninput=e=>{r.note=e.target.value;save(status)};
$('[data-export]',d).onclick=()=>download('kidhub-'+id+'-journal.txt',cfg[0]+'\n\n'+missions.map((m,i)=>(r.done[i]?'[x] ':'[ ] ')+m).join('\n')+'\n\nMy discoveries\n'+r.note);
$('[data-reset]',d).onclick=()=>{r.done=[false,false,false];d.querySelectorAll('[data-done]').forEach(c=>c.checked=false);update();save(status)};update();if(C[id])extra(id,$('[data-extra]',d));return d;
}
const prompts={who:['a curious robot','a tiny dragon','a brave snail','a sleepy astronaut','a musical fox','a friendly cloud'],where:['a floating library','a moon garden','an underwater town','a forest bakery','a rainbow bridge','a hidden treehouse'],problem:['a missing map','a broken song','a surprising visitor','a lost seed','a mixed-up message','a storm of bubbles']};
function extra(id,el){
 if(['draw','stories','storybook'].includes(id)){el.innerHTML='<h3>🎲 Imagination mixer</h3><p data-idea></p><button type="button" data-new>New combination</button><button type="button" data-copy>Use in my journal</button>';const next=()=>{$('[data-idea]',el).textContent=`Imagine ${pick(prompts.who)} in ${pick(prompts.where)} solving the mystery of ${pick(prompts.problem)}.`};$('[data-new]',el).onclick=next;$('[data-copy]',el).onclick=()=>{const r=record(id);r.note=(r.note+'\n'+$('[data-idea]',el).textContent).trim().slice(0,1200);$('textarea',el.parentElement).value=r.note;save($('.adv-status',el.parentElement))};next();return}
 if(['music','music-maker'].includes(id)){el.innerHTML='<h3>👏 Rhythm builder</h3><p>Toggle eight beats. Filled beats sound; empty beats are rests.</p><div class="adv-grid" data-beats></div><label>Tempo <input type="range" min="60" max="160" value="100" data-bpm> <output>100 BPM</output></label><div class="adv-row"><button type="button" data-play>▶ Play once</button><button type="button" data-stop>■ Stop</button></div>';let beats=[1,0,1,0,1,1,0,0],timers=[];const stop=()=>{timers.forEach(clearTimeout);timers=[]};for(let i=0;i<8;i++){const b=document.createElement('button');b.type='button';b.textContent=String(i+1);b.setAttribute('aria-label','Rhythm beat '+(i+1));const paint=()=>{b.setAttribute('aria-pressed',!!beats[i]);b.style.background=beats[i]?'#ffe066':'';b.style.color=beats[i]?'#25304a':''};paint();b.onclick=()=>{beats[i]^=1;paint()};$('[data-beats]',el).append(b)}$('[data-bpm]',el).oninput=e=>$('output',el).textContent=e.target.value+' BPM';$('[data-play]',el).onclick=()=>{stop();beats.forEach((v,i)=>{if(v)timers.push(setTimeout(()=>{if(app.current===id&&!document.hidden)music.tone(300+i*30,.08)},i*60000/+$('[data-bpm]',el).value))})};$('[data-stop]',el).onclick=stop;cleanup.push(stop);return}
 if(id==='color'){el.innerHTML='<h3>🧵 Pattern quilt</h3><label>Quilt color <input type="color" value="#7c5ce7" data-ink></label><div class="adv-grid" data-quilt></div><button type="button" data-save>↓ Save quilt SVG</button>';const cells=Array(16).fill('#ffffff');cells.forEach((_,i)=>{const b=document.createElement('button');b.type='button';b.textContent='◇';b.setAttribute('aria-label','Color quilt square '+(i+1));b.onclick=()=>{cells[i]=$('[data-ink]',el).value;b.style.background=cells[i]};$('[data-quilt]',el).append(b)});$('[data-save]',el).onclick=()=>download('my-pattern-quilt.svg',`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">${cells.map((c,i)=>`<rect x="${i%4*100}" y="${Math.floor(i/4)*100}" width="100" height="100" fill="${c}" stroke="#25304a"/>`).join('')}</svg>`);return}
 if(['math','clock','spelling','coding','space','farm','dino','puzzle','memory','game'].includes(id))practice(id,el);
}
const banks={
space:[['Which planet is third from the Sun?','Earth',['Mars','Venus'],'Earth comes after Mercury and Venus.'],['Which planet comes just after Earth?','Mars',['Saturn','Mercury'],'The inner planets are Mercury, Venus, Earth, Mars.'],['How many planets are in our solar system?','8',['6','10'],'The planet-order activity contains eight planet cards.']],
farm:[['Which animal says moo?','Cow',['Duck','Sheep'],'Moo is the storybook call of a cow.'],['Which animal says neigh?','Horse',['Pig','Cat'],'A horse can neigh or whinny.'],['Which animal says quack?','Duck',['Dog','Chicken'],'Quack is a familiar duck call.']],
dino:[['What should you record after a find?','Its location',['Only its color','Nothing'],'A location helps us understand the context of a find.'],['What is a good museum label?','A description and a question',['A made-up certainty','No words'],'Separate what you observe from what you wonder.'],['How should you uncover a fragile find?','Carefully',['With force','As fast as possible'],'Careful work helps preserve details.']],
puzzle:[['Which tile can slide into the blank?','A tile sharing an edge',['A diagonal tile','Any tile'],'Sliding moves use horizontal or vertical neighbors.'],['What helps solve a sliding puzzle?','Plan a few moves ahead',['Tap every tile quickly','Ignore the blank'],'Moving the blank changes which moves are possible.'],['What does undo help you do?','Compare an earlier choice',['Earn automatic points','Skip all rules'],'Undo supports experimenting and learning.']],
memory:[['How can you remember a card?','Name its picture and position',['Close the game','Tap every card quickly'],'A picture plus a position creates two memory clues.'],['What makes a pair?','Two matching pictures',['Two nearby cards','Any two cards'],'Look for the same picture on both cards.'],['How can you compare your rounds?','Record your moves',['Change everything at once','Guess the result'],'A move count gives you a concrete comparison.']],
game:[['What helps accurate tapping?','Watching the next target',['Tapping everywhere','Ignoring the board'],'Look for the target before tapping.'],['What is a useful practice goal?','Improve one skill',['Win every time','Never take a break'],'Small goals make progress easier to notice.'],['When is it fine to pause?','Whenever you need a break',['Only after winning','Never'],'You can set your own pace.']]
};
function practice(id,el){let score=0,total=0,q,locked=false;el.innerHTML='<h3>🧪 Practice lab</h3><label>Practice level <select data-depth><option value="1">Starter</option><option value="2">Builder</option><option value="3">Explorer</option></select></label><p data-question></p><div class="adv-row" data-answers></div><p role="status" data-feedback></p><button type="button" data-next>Next practice</button><p data-score></p>';function next(){locked=false;const level=+$('[data-depth]',el).value;if(id==='math'){const a=2+Math.floor(Math.random()*level*6),b=1+Math.floor(Math.random()*level*4);q=[`${a} baskets have ${b} apples each. How many apples?`,String(a*b),[String(a+b+1),String(a*b+2)],`${a} groups of ${b} means ${a} × ${b} = ${a*b}.`]}else if(id==='clock'){const h=1+Math.floor(Math.random()*11),m=pick([0,15,30,45]);q=[`What is ${h}:${String(m).padStart(2,'0')} plus ${level*15} minutes?`,`${(h+Math.floor((m+level*15)/60)-1)%12+1}:${String((m+level*15)%60).padStart(2,'0')}`,['12:59','0:99'],'Add minutes; every 60 minutes advances the hour.']}else if(id==='coding'){const a=level+1,b=level;q=[`Robot starts at (0, 0). Move right ${a}, then down ${b}. Where is it (column, row)?`,`${a}, ${b}`,[`${b}, ${a}`,`${a+1}, ${b+1}`],'Right changes the column; down changes the row.']}else if(id==='spelling'){const words=['garden','rocket','butterfly','rainbow','planet','music','friend','puzzle','flower','animal','window','yellow'];const w=pick(words.filter(w=>w.length<=4+level*3)),k=Math.floor(w.length/2);q=[`Complete the word: ${w.slice(0,k)}_${w.slice(k+1)}`,w[k],['q','x','z'].filter(v=>v!==w[k]).slice(0,2),`The complete word is ${w}.`]}else{const list=banks[id];q=list[total%list.length]}
$('[data-question]',el).textContent=q[0];$('[data-feedback]',el).textContent='';$('[data-answers]',el).replaceChildren();const options=[...new Set([q[1],...q[2]])].sort(()=>Math.random()-.5);options.forEach(v=>{const b=document.createElement('button');b.type='button';b.textContent=v;b.onclick=()=>{if(locked)return;locked=true;total++;const ok=v===q[1];if(ok)score++;$('[data-feedback]',el).textContent=(ok?'Correct! ':'Not quite. ')+q[3];$('[data-score]',el).textContent=`${score}/${total} correct this visit`;el.querySelectorAll('[data-answers] button').forEach(x=>x.disabled=true)};$('[data-answers]',el).append(b)})}
$('[data-next]',el).onclick=next;$('[data-depth]',el).onchange=next;next();}
const cleanup=[];const show=app.show.bind(app);app.show=(id,...args)=>{cleanup.forEach(fn=>fn());const r=show(id,...args);const sec=$('#s-'+id);if(sec&&C[id])make(id,$('.activity',sec)||sec);return r};
const toolMissions={math:['Solve a small example and check it by counting.','Predict how changing one number changes the result.','Write a matching real-life number problem.'],words:['Read the example aloud or silently and explain its meaning.','Create a different word or sentence using the same idea.','Teach the pattern to a friend using your own example.'],science:['Observe one example and write what you notice.','Predict a second example before revealing it.','Write one question you could explore with a book or a helper.'],time:['Try an example from your daily routine.','Change the time, date, or amount and compare the result.','Explain the steps you would use without the tool.'],arts:['Make a short pattern using just two elements.','Change one color, sound, or shape and compare the mood.','Create an original pattern with repetition and contrast.'],games:['Learn the rules using a practice round.','Predict a result or plan your next move before acting.','Describe one strategy and compare two attempts.'],well:['Choose an exercise that feels comfortable; skip anything you dislike.','Notice how you feel before and after trying it.','Write a personal reminder or choose a helpful routine.'],help:['Try the helper with non-sensitive sample information.','Change one input and check the output or list.','Describe one everyday task where this tool could help.']};
function toolTrail(){const box=$('#kpTool');if(!box||box.hidden)return;const heading=$('h3',box)||$('h2',box);if(!heading)return;const title=heading.textContent.trim(),id='tool-'+(box.dataset.toolId||title.replace(/[^a-z0-9]/gi,'').slice(0,60));make(id,box,[title,(toolMissions[box.dataset.toolCategory]||toolMissions.help).join('|'),'Compare what you expected with what actually happened.'])}
const toolbox=$('#kpTool');if(toolbox)new MutationObserver(()=>toolTrail()).observe(toolbox,{childList:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)cleanup.forEach(fn=>fn())});
window.KidHubAdventures={activities:Object.keys(C),record,toolTrail,version:1};
if(C[app.current]){const sec=$('#s-'+app.current);if(sec)make(app.current,$('.activity',sec)||sec)}
})();
</script>
