<style id="paint-css">
.pp{margin:0 0 10px;background:linear-gradient(135deg,#fff,#f6f1ff);border:2px solid #e8def8;border-radius:18px;padding:8px;box-shadow:0 6px 18px rgba(80,50,160,.08)}

.pp,.pp label,.pp input,.pp select,.pp output,.pp small{font-size:13px!important;line-height:1.3}
.pp label{display:inline-flex!important;align-items:center;gap:4px;margin:0!important;font-weight:700;width:auto!important}

.pp button:focus-visible,.pp input:focus-visible,.pp select:focus-visible{outline:3px solid #6d4aff;outline-offset:2px}
.pp button.on{background:linear-gradient(135deg,#6d4aff,#ff5fa2);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(109,74,255,.35)}
.pp-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.pp-tabs button{border-radius:999px;font-size:13px}
.pp-tools{display:flex;flex-wrap:wrap;gap:4px;max-height:132px;overflow:auto;padding:2px}
.pp-tool{display:inline-flex;align-items:center;gap:4px;font-size:13px}

.pp-colors{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.pp-well{width:40px;height:40px;border-radius:12px!important;border:3px solid #fff!important;box-shadow:0 0 0 2px #6d4aff,0 3px 8px rgba(0,0,0,.2)}
.pp-well.c2{width:32px;height:32px;min-width:32px;min-height:32px;box-shadow:0 0 0 2px #ff5fa2}
.pp-pal{display:grid;grid-template-columns:repeat(14,22px);gap:3px}
.pp-pal button{min-width:22px;min-height:22px;width:22px;height:22px;padding:0;border-radius:6px;border:1px solid rgba(0,0,0,.25)}
.pp-pal button.empty{background:repeating-linear-gradient(45deg,#fff 0 4px,#eee 4px 8px)}
.pp-ed{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;padding:8px;border-radius:14px;background:#fff;border:2px dashed #d9ccff}
.pp-ed canvas{border-radius:10px;cursor:crosshair;touch-action:none;border:1px solid #ccc;max-width:100%}

.pp-ed .fields{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-size:13px;min-width:170px}
.pp-ed .fields input{width:90px;font:inherit;border:2px solid #e3dcf2;border-radius:8px;padding:3px 6px}
.pp-prev{width:56px;height:40px;border-radius:10px;border:2px solid #ccc}
.pp-status{font-size:12px;color:#5b6478;margin-top:4px;min-height:1.4em}
.pp-stage{position:relative;overflow:auto;max-height:78vh;border-radius:16px}
.pp-inner{position:relative;width:100%}
.pp-inner #canvas{display:block;width:100%!important;height:auto!important}
.pp-over{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pp-skew{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media (max-width:600px){.pp-pal{grid-template-columns:repeat(10,22px)}.pp-tools{max-height:180px}}
@media (prefers-reduced-motion:reduce){.pp button{transition:none}.pp button:hover{transform:none}}
