<body>
<div id="game-container">
<div id="overlay">
<h1 id="msg">NEON PONG</h1>
<div class="grid" id="mode-grid">
<div class="card" onclick="mode='solo'; startGame()">SOLO</div>
<div class="card" onclick="mode='cpu'; showDifficulty()">VS CPU</div>
<div class="card" onclick="mode='two'; startGame()">2 PLAYER</div>
</div>
<div class="grid" id="diff-grid" style="display:none">
<div class="card" onclick="startCPU('easy')">😌 EASY</div>
<div class="card" onclick="startCPU('medium')">😎 MEDIUM</div>
<div class="card" onclick="startCPU('hard')">🤖 HARD</div>
</div>
<p id="best-line" style="margin:10px 0 0;color:#0df;font-weight:bold">🏆 BEST RALLY: 0</p>
</div>
<div id="pause-overlay" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:25;align-items:center;justify-content:center;cursor:pointer" onclick="togglePause(true)">
<div style="text-align:center"><h1>⏸ PAUSED</h1><p>click or press P to resume</p></div>
</div>
<div id="ui-layer">
<button onclick="resetGame()">RESTART</button>
<button onclick="location.reload()">EXIT</button>
</div>
<canvas id="c"></canvas>
</div>
<script>
        const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        let w, h, p1Y = 0, p2Y = 0, mode = 'solo', gameRunning = false, winner = '';
        let p1Score = 0, p2Score = 0;
        let ball = { x: 100, y: 100, dx: 8, dy: 8, speed: 8, size: 8, lastHit: 0, trail: [] };
        // N8 cycle-3: AI difficulty levels, hit particles, paddle flash, best-rally persistence, pause
        let aiLevel = 'medium', paused = false, rally = 0, bestRally = 0;
        let particles = [], flashP1 = 0, flashP2 = 0;
        try { bestRally = parseInt(localStorage.getItem('neonPongBestRally') || '0', 10) || 0; } catch(e) {}

        function resize() { w = canvas.width = container.clientWidth - 24; h = canvas.height = container.clientHeight - 24; }
        window.onresize = resize; resize();
        window.onmousemove = (e) => p1Y = e.clientY - 60;

        function resetGame() { p1Score = 0; p2Score = 0; winner = ''; rally = 0; gameRunning = true; paused = false; document.getElementById('overlay').style.display = 'none'; document.getElementById('pause-overlay').style.display = 'none'; }
        function startGame() { resetGame(); }
        function showDifficulty() { document.getElementById('mode-grid').style.display = 'none'; document.getElementById('diff-grid').style.display = 'flex'; }
        function startCPU(level) { aiLevel = level; resetGame(); }
        function togglePause(resume) {
            if(!gameRunning || winner) return;
            paused = (resume === true) ? false : !paused;
            document.getElementById('pause-overlay').style.display = paused ? 'flex' : 'none';
        }
        function autoPause() { if(gameRunning && !winner && !paused) togglePause(); }
        function saveBest() {
            if(rally > bestRally) {
                bestRally = rally;
                try { localStorage.setItem('neonPongBestRally', String(bestRally)); } catch(e) {}
                updateBestLine();
            }
        }
        function updateBestLine() {
            const el = document.getElementById('best-line');
            if(el) el.textContent = '🏆 BEST RALLY: ' + bestRally + (mode === 'cpu' ? '  •  ' + aiLevel.toUpperCase() + ' AI' : '');
        }
        function spawnBurst(x, y, color) {
            for(let i = 0; i < 14; i++) {
                const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 4;
                particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 30 + Math.random() * 20, max: 50, color });
            }
        }
        window.addEventListener('blur', autoPause);
        document.addEventListener('visibilitychange', () => { if(document.hidden) autoPause(); });
        window.onkeydown = (e) => { if(e.key === 'p' || e.key === 'P') togglePause(); };
        updateBestLine();
        
        function shake() {
            container.style.transform = 'translate(-10px, -10px)';
            setTimeout(() => container.style.transform = 'translate(0, 0)', 50);
        }

        function update() {
            if(!gameRunning || winner || paused) return;
            ball.x += ball.dx; ball.y += ball.dy;
            
            // Trail effect
            ball.trail.push({x: ball.x, y: ball.y});
            if(ball.trail.length > 10) ball.trail.shift();

            // Spark particles fade out
            for(let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life--;
                if(p.life <= 0) particles.splice(i, 1);
            }
            if(flashP1 > 0) flashP1--;
            if(flashP2 > 0) flashP2--;

            if (ball.y < ball.size || ball.y > h - ball.size) ball.dy *= -1;

            // Collision with Spin/Shake + flash + particle burst
            if (ball.x <= 40 && ball.x >= 20 && ball.y >= p1Y && ball.y <= p1Y + 120) {
                if(ball.dx < 0 && Date.now() - ball.lastHit > 200) { ball.dx = Math.abs(ball.speed) + 0.5; shake(); ball.lastHit = Date.now(); flashP1 = 10; rally++; spawnBurst(30, ball.y, '#0df'); }
            }
            if (ball.x >= w - 40 && ball.x <= w - 20 && ball.y >= p2Y && ball.y <= p2Y + 120) {
                if(ball.dx > 0 && Date.now() - ball.lastHit > 200) { ball.dx = -(Math.abs(ball.speed) + 0.5); shake(); ball.lastHit = Date.now(); flashP2 = 10; rally++; spawnBurst(w - 30, ball.y, '#0df'); }
            }

            // 3 AI difficulty levels
            if(mode === 'cpu') {
                const AI = { easy: { rate: 0.05, lead: 0 }, medium: { rate: 0.10, lead: 2 }, hard: { rate: 0.16, lead: 5 } }[aiLevel] || { rate: 0.10, lead: 2 };
                const target = (ball.y - 60) + ball.dy * AI.lead;
                p2Y += (target - p2Y) * AI.rate;
            }
            
            if (ball.x < 0) { p2Score++; ball.x = w/2; saveBest(); rally = 0; if(p2Score >= 5) winner = 'CPU/P2 WINS!'; }
            if (ball.x > w) { p1Score++; ball.x = w/2; saveBest(); rally = 0; if(p1Score >= 5) winner = 'PLAYER 1 WINS!'; }
        }

        function draw() {
    ctx.clearRect(0, 0, w, h);
    
    // Draw Enhanced Trails
    ball.trail.forEach((p, i) => {
        ctx.globalAlpha = i / ball.trail.length;
        let grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, ball.size * 2);
        grad.addColorStop(0, '#0df');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(p.x, p.y, ball.size * 1.5, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    // Draw "Energy Orb" Ball
    let orb = ctx.createRadialGradient(ball.x - ball.size/4, ball.y - ball.size/4, ball.size/8, ball.x, ball.y, ball.size);
    orb.addColorStop(0, '#fff'); // Bright center
    orb.addColorStop(0.2, '#0df'); // Neon core
    orb.addColorStop(1, '#0055ff'); // Deep glow edge
    
    ctx.shadowBlur = 20; 
    ctx.shadowColor = '#0df';
    ctx.fillStyle = orb;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0; // Reset for other elements

    // Draw Paddles (flash white on hit)
    const p1Color = flashP1 > 0 ? '#fff' : '#0df';
    const p2Color = flashP2 > 0 ? '#fff' : '#0df';
    ctx.fillStyle = p1Color;
    ctx.shadowBlur = 10; ctx.shadowColor = p1Color;
    ctx.fillRect(20, p1Y, 10, 120);
    ctx.fillStyle = p2Color;
    ctx.shadowBlur = 10; ctx.shadowColor = p2Color;
    ctx.fillRect(w - 30, p2Y, 10, 120);
    ctx.shadowBlur = 0;

    // Draw spark particles
    particles.forEach((p) => {
        ctx.globalAlpha = Math.max(0, p.life / p.max);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1.0;
    
    // Scoreboard
    ctx.fillStyle = "#fff"; ctx.font = "30px Arial";
    ctx.fillText(winner || `${p1Score} - ${p2Score}`, w/2 - 50, 50);
    ctx.font = "16px Arial"; ctx.fillStyle = "#0df";
    ctx.fillText('RALLY ' + rally + '   🏆 ' + bestRally, 20, 30);
    if(paused) { ctx.fillStyle = '#ffe066'; ctx.font = '24px Arial'; ctx.fillText('⏸ PAUSED', w/2 - 70, h/2); }
    
    update(); requestAnimationFrame(draw);
}
        draw();
    </script>
